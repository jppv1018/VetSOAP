<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VetSOAP — Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
    }
    .login-logo {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 0.25rem;
    }
    .login-title {
      text-align: center;
      font-weight: 700;
      font-size: 1.5rem;
      color: #212529;
    }
    .login-subtitle {
      text-align: center;
      color: #6c757d;
      font-size: 0.88rem;
      margin-bottom: 1.75rem;
    }
    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 .2rem rgba(13,110,253,.18);
    }
    .btn-login {
      background: linear-gradient(90deg, #0d6efd, #6610f2);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: .65rem;
      border-radius: 10px;
      transition: opacity .2s;
    }
    .btn-login:hover { opacity: .88; color: #fff; }
    .badge-soap {
      background: #198754;
      color: #fff;
      font-size: .68rem;
      padding: 2px 8px;
      border-radius: 20px;
      vertical-align: middle;
    }
    .input-group-text {
      background: #f4f6fb;
      border-right: none;
    }
    .form-control { border-left: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">🐾</div>
    <div class="login-title">VetSOAP <span class="badge-soap">SOAP</span></div>
    <div class="login-subtitle">Sistema de gestión veterinaria</div>

    {% if error %}
      <div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endif %}

    <form method="post" action="/login/">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold small text-muted">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill text-muted"></i></span>
          <input type="text" name="username" class="form-control"
                 placeholder="Ingresa tu usuario" autofocus required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small text-muted">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill text-muted"></i></span>
          <input type="password" name="password" class="form-control"
                 placeholder="Ingresa tu contraseña" required>
        </div>
      </div>
      <button type="submit" class="btn btn-login w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
      </button>
    </form>

    <p class="text-center text-muted mt-4 mb-0" style="font-size:.78rem;">
      Solo el administrador puede acceder a esta plataforma.
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
