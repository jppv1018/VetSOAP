<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🐾 VetSOAP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f4f6fb; }
    .navbar { background: linear-gradient(90deg,#0d6efd,#6610f2); }
    .navbar-brand, .nav-link { color: #fff !important; }
    .nav-link:hover { opacity: .8; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .badge-soap { background:#198754; color:#fff; font-size:.7rem; padding:2px 7px;
                  border-radius:20px; vertical-align:middle; }
    .btn-logout { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.4);
                  color:#fff !important; border-radius:8px; font-size:.85rem; padding: 4px 12px; }
    .btn-logout:hover { background: rgba(255,255,255,.28); }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-pulse"></i> VetSOAP</a>
    <span class="badge-soap ms-2">SOAP</span>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li class="nav-item"><a class="nav-link" href="/duenos/"><i class="bi bi-people"></i> Dueños</a></li>
        <li class="nav-item"><a class="nav-link" href="/mascotas/"><i class="bi bi-heart"></i> Mascotas</a></li>
        <li class="nav-item"><a class="nav-link" href="/consultas/"><i class="bi bi-clipboard2-pulse"></i> Consultas</a></li>
        <li class="nav-item"><a class="nav-link" href="/informe/"><i class="bi bi-bar-chart-line"></i> Informe XML</a></li>
        <li class="nav-item ms-3">
          <span class="nav-link pe-2" style="opacity:.7;font-size:.85rem;">
            <i class="bi bi-person-circle"></i> {{ request.user.username }}
          </span>
        </li>
        <li class="nav-item">
          <a class="nav-link btn-logout" href="/logout/"><i class="bi bi-box-arrow-right"></i> Salir</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show">
        {{ m }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
