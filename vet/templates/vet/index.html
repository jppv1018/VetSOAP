{% extends 'vet/base.html' %}
{% block content %}
<div class="row g-4 mt-2">
  <div class="col-12 text-center mb-3">
    <h1 class="display-5 fw-bold">🐾 Sistema Veterinario</h1>
    <p class="text-muted">CRUD completo con servicios web SOAP</p>
  </div>
  <div class="col-md-4">
    <a href="/duenos/" class="text-decoration-none">
      <div class="card p-4 text-center h-100">
        <i class="bi bi-people-fill fs-1 text-primary"></i>
        <h5 class="mt-3">Dueños</h5>
        <p class="text-muted small">Registrar y gestionar propietarios de mascotas</p>
      </div>
    </a>
  </div>
  <div class="col-md-4">
    <a href="/mascotas/" class="text-decoration-none">
      <div class="card p-4 text-center h-100">
        <i class="bi bi-heart-fill fs-1 text-danger"></i>
        <h5 class="mt-3">Mascotas</h5>
        <p class="text-muted small">Perros, gatos, aves y más</p>
      </div>
    </a>
  </div>
  <div class="col-md-4">
    <a href="/consultas/" class="text-decoration-none">
      <div class="card p-4 text-center h-100">
        <i class="bi bi-clipboard2-pulse-fill fs-1 text-success"></i>
        <h5 class="mt-3">Consultas</h5>
        <p class="text-muted small">Historial médico y costos</p>
      </div>
    </a>
  </div>
  <div class="col-12 text-center mt-2">
    <a href="/informe/" class="btn btn-outline-primary btn-lg">
      <i class="bi bi-bar-chart-line"></i> Ver Informe XML con D3.js
    </a>
  </div>
</div>
{% endblock %}
